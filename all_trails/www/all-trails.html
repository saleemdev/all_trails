<!doctype html>
<html lang="en" data-theme="trails">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/all_trails/frontend/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Discover and book amazing hiking trails across Kenya and beyond with Step Up Adventures." />
    <meta name="keywords" content="hiking, trails, Kenya, adventure, outdoor, step up adventures" />
    <meta name="author" content="Step Up Adventures" />
    <meta name="theme-color" content="#1B3A2D" />
    <meta property="og:title" content="Step Up Adventures - Hiking Management Platform" />
    <meta property="og:description" content="Discover and book amazing hiking trails across Kenya and beyond with Step Up Adventures." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Step Up Adventures - Hiking Management Platform" />
    <meta name="twitter:description" content="Discover and book amazing hiking trails across Kenya and beyond with Step Up Adventures." />
    <title>Step Up Adventures - Hiking Management Platform</title>
    <script>
      // Dynamically load frontend assets based on Vite manifest
      (function() {
        // Fallback hashes in case API fails (for initial deployments)
        // Note: These *do* include the `assets/` prefix because Vite outputs into an `assets/` subdirectory,
        // and BASE_PATH intentionally points to `/assets/all_trails/frontend/` (without the trailing `assets/`).
        const FALLBACK_JS = 'assets/index-HRiodYK0.js';
        const FALLBACK_CSS = 'assets/index-DIZCIy9e.css';
        const BASE_PATH = '/assets/all_trails/frontend/';

        async function loadAssets() {
          try {
            // Try to fetch the manifest from the API endpoint
            const response = await fetch('/api/method/all_trails.api.get_frontend_assets');
            const data = await response.json();

            let jsFile = FALLBACK_JS;
            let cssFile = FALLBACK_CSS;

            // Use API response if successful
            if (data.message && data.message.success && data.message.js_file) {
              jsFile = data.message.js_file;
              if (data.message.css_file) {
                cssFile = data.message.css_file;
              }
            }

            // Load CSS
            if (cssFile) {
              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.crossOrigin = 'anonymous';
              link.href = BASE_PATH + cssFile;
              document.head.appendChild(link);
            }

            // Load JavaScript
            if (jsFile) {
              const script = document.createElement('script');
              script.type = 'module';
              script.crossOrigin = 'anonymous';
              script.src = BASE_PATH + jsFile;
              document.head.appendChild(script);
            }
          } catch (error) {
            console.error('Failed to load frontend assets:', error);
            // Fallback: load with hardcoded hashes
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.crossOrigin = 'anonymous';
            link.href = BASE_PATH + FALLBACK_CSS;
            document.head.appendChild(link);

            const script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = BASE_PATH + FALLBACK_JS;
            document.head.appendChild(script);
          }
        }

        // Load assets when DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadAssets);
        } else {
          loadAssets();
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>window.csrf_token='{{ frappe.session.csrf_token }}'</script>
  </body>
</html>
