<form class="form-signin form-signup hide alx-signup" role="form" novalidate>
    <div class="alx-card" data-alx-signup>
        <div class="alx-wordmark" aria-hidden="true">Stepup Adventures</div>

        <div class="alx-progress" aria-label="Signup progress">
            <span class="alx-progress-dot is-active" data-dot="1"></span>
            <span class="alx-progress-dot" data-dot="2"></span>
            <span class="alx-progress-dot" data-dot="3"></span>
        </div>

        <button type="button" class="alx-back" data-action="back" aria-label="Back to previous step">&larr; Back</button>

        <div class="alx-heading-wrap">
            <h2 class="alx-heading" data-heading>Create account</h2>
            <p class="alx-subheading" data-subheading>What should we call you?</p>
        </div>

        <div class="page-card-body alx-page-card-body" data-signup-body>
            <div class="alx-steps" data-steps>
                <section class="alx-step is-active" data-step="1" aria-hidden="false">
                    <div class="alx-field" data-field="fullname">
                        <input
                            type="text"
                            id="signup_fullname"
                            class="alx-input"
                            placeholder=" "
                            required
                            autofocus
                            autocomplete="name"
                            aria-required="true"
                        >
                        <label class="alx-label" for="signup_fullname">Full name</label>
                        <span class="alx-valid-icon" aria-hidden="true">
                            <svg viewBox="0 0 16 16" focusable="false" aria-hidden="true">
                                <path d="M3 8.3l3 3.1 7-7.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </span>
                    </div>
                </section>

                <section class="alx-step" data-step="2" aria-hidden="true">
                    <div class="alx-field" data-field="email">
                        <input
                            type="email"
                            id="signup_email"
                            class="alx-input"
                            placeholder=" "
                            required
                            autocomplete="username"
                            aria-required="true"
                        >
                        <label class="alx-label" for="signup_email">Email or phone</label>
                        <span class="alx-valid-icon" aria-hidden="true">
                            <svg viewBox="0 0 16 16" focusable="false" aria-hidden="true">
                                <path d="M3 8.3l3 3.1 7-7.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </span>
                    </div>

                    <div class="alx-password-wrap" data-password-wrap>
                        <div class="alx-field" data-field="password">
                            <input
                                type="password"
                                id="signup_password"
                                class="alx-input alx-input-password"
                                placeholder=" "
                                autocomplete="new-password"
                            >
                            <label class="alx-label" for="signup_password">Password</label>
                            <button type="button" class="alx-toggle-password" data-action="toggle-password" aria-label="Show password">
                                <svg data-eye="closed" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                    <path d="M2 12c1.5-4.8 5.7-7 10-7s8.5 2.2 10 7c-1.5 4.8-5.7 7-10 7s-8.5-2.2-10-7zm10 4a4 4 0 100-8 4 4 0 000 8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                                <svg data-eye="open" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                    <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
                                    <path d="M10.5 6.3A9.9 9.9 0 0112 6c4.3 0 8.5 2.2 10 7a10.6 10.6 0 01-3.1 4.6M6.3 10.5A11.9 11.9 0 002 12c1.5 4.8 5.7 7 10 7 1.5 0 3-.3 4.3-.9M9.9 9.9a3 3 0 104.2 4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </button>
                        </div>

                        <div class="alx-strength" data-strength>
                            <div class="alx-strength-bar" aria-hidden="true">
                                <span class="alx-strength-segment" data-segment="1"></span>
                                <span class="alx-strength-segment" data-segment="2"></span>
                                <span class="alx-strength-segment" data-segment="3"></span>
                                <span class="alx-strength-segment" data-segment="4"></span>
                            </div>
                            <span class="alx-strength-label" data-strength-label></span>
                        </div>
                    </div>
                </section>

                <section class="alx-step" data-step="3" aria-hidden="true">
                    <div class="alx-field" data-field="confirm-password">
                        <input
                            type="password"
                            id="signup_confirm_password"
                            class="alx-input"
                            placeholder=" "
                            autocomplete="new-password"
                        >
                        <label class="alx-label" for="signup_confirm_password">Confirm password</label>
                        <span class="alx-valid-icon" aria-hidden="true">
                            <svg viewBox="0 0 16 16" focusable="false" aria-hidden="true">
                                <path d="M3 8.3l3 3.1 7-7.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </span>
                    </div>
                </section>
            </div>
            <p class="alx-inline-error" data-inline-error role="alert" aria-live="polite"></p>
        </div>

        <div class="page-card-actions alx-page-card-actions">
            <button type="button" class="btn btn-sm btn-primary btn-block alx-continue" data-action="continue" disabled>
                Continue
            </button>
            <button class="btn btn-sm btn-primary btn-block btn-signup alx-submit" type="submit" disabled>
                Create account
            </button>

            <p class="text-center sign-up-message alx-secondary-action">
                <span>Already have an account?</span>
                <a href="#login" class="blue">Sign in</a>
            </p>
        </div>
    </div>
</form>

<style>

<script>
(function () {
    const form = document.querySelector('.alx-signup');
    if (!form || form.dataset.alxReady === 'true') {
        return;
    }
    form.dataset.alxReady = 'true';

    const card = form.querySelector('.alx-card');
    const steps = Array.from(form.querySelectorAll('.alx-step'));
    const progressDots = Array.from(form.querySelectorAll('.alx-progress-dot'));
    const heading = form.querySelector('[data-heading]');
    const subheading = form.querySelector('[data-subheading]');
    const backButton = form.querySelector('[data-action="back"]');
    const continueButton = form.querySelector('[data-action="continue"]');
    const submitButton = form.querySelector('.alx-submit');
    const secondaryAction = form.querySelector('.alx-secondary-action');
    const inlineError = form.querySelector('[data-inline-error]');

    const fullNameInput = form.querySelector('#signup_fullname');
    const emailInput = form.querySelector('#signup_email');
    const passwordInput = form.querySelector('#signup_password');
    const confirmPasswordInput = form.querySelector('#signup_confirm_password');

    const fullNameField = form.querySelector('[data-field="fullname"]');
    const emailField = form.querySelector('[data-field="email"]');
    const passwordField = form.querySelector('[data-field="password"]');
    const confirmPasswordField = form.querySelector('[data-field="confirm-password"]');
    const passwordWrap = form.querySelector('[data-password-wrap]');

    const togglePasswordButton = form.querySelector('[data-action="toggle-password"]');
    const strengthLabel = form.querySelector('[data-strength-label]');
    const strengthSegments = Array.from(form.querySelectorAll('.alx-strength-segment'));

    const EMAIL_PATTERN = /^\S+@\S+\.\S+$/;

    const state = {
        step: 1,
        passwordVisible: false,
    };

    const clampStep = (step) => Math.max(1, Math.min(3, step));

    const getDisplayName = () => {
        const name = (fullNameInput.value || '').trim();
        if (!name) {
            return 'there';
        }
        return name.split(/\s+/)[0];
    };

    const isEmailValid = () => EMAIL_PATTERN.test((emailInput.value || '').trim());

    const scorePassword = (value) => {
        let score = 0;
        if (value.length >= 8) score++;
        if (/[A-Z]/.test(value)) score++;
        if (/[0-9]/.test(value)) score++;
        if (/[^A-Za-z0-9]/.test(value)) score++;
        return score;
    };

    const clearInlineError = () => {
        inlineError.textContent = '';
        inlineError.classList.remove('is-visible');
    };

    const showInlineError = (message) => {
        inlineError.textContent = message;
        inlineError.classList.add('is-visible');
    };

    const updateHeading = () => {
        if (state.step === 1) {
            heading.textContent = 'Create account';
            subheading.textContent = 'What should we call you?';
        } else if (state.step === 2) {
            heading.textContent = 'Hi ' + getDisplayName();
            subheading.textContent = 'Set up your login details';
        } else {
            heading.textContent = 'Almost done';
            subheading.textContent = "Confirm and you're in";
        }
    };

    const updateProgress = () => {
        progressDots.forEach((dot, index) => {
            dot.classList.toggle('is-active', index === state.step - 1);
        });
        card.dataset.step = String(state.step);
    };

    const updateBackButton = () => {
        backButton.classList.toggle('is-visible', state.step > 1);
    };

    const updateSecondaryAction = () => {
        secondaryAction.classList.toggle('is-hidden', state.step > 1);
    };

    const updateFieldStates = () => {
        const fullName = (fullNameInput.value || '').trim();
        const email = (emailInput.value || '').trim();
        const password = passwordInput.value || '';
        const confirm = confirmPasswordInput.value || '';

        fullNameField.classList.toggle('is-filled', fullName.length > 0);
        emailField.classList.toggle('is-filled', email.length > 0);
        passwordField.classList.toggle('is-filled', password.length > 0);
        confirmPasswordField.classList.toggle('is-filled', confirm.length > 0);

        fullNameField.classList.toggle('is-valid', fullName.length > 1);
        emailField.classList.toggle('is-valid', isEmailValid());
        passwordField.classList.toggle('is-valid', scorePassword(password) >= 2);
        confirmPasswordField.classList.toggle('is-valid', confirm.length > 0 && confirm === password);

        if (!confirm || confirm === password) {
            confirmPasswordField.classList.remove('is-error');
            clearInlineError();
        }
    };

    const updateStrength = () => {
        const password = passwordInput.value || '';
        const score = scorePassword(password);

        const palette = {
            1: { color: '#c0392b', label: 'Weak' },
            2: { color: '#e67e22', label: 'Fair' },
            3: { color: 'var(--accent-primary)', label: 'Good' },
            4: { color: 'var(--color-forest)', label: 'Strong' },
        };

        strengthSegments.forEach((segment, index) => {
            if (index < score) {
                segment.style.backgroundColor = palette[score].color;
            } else {
                segment.style.backgroundColor = 'var(--border-default)';
            }
        });

        if (score === 0) {
            strengthLabel.textContent = '';
            strengthLabel.style.color = 'var(--text-tertiary)';
            return;
        }

        strengthLabel.textContent = palette[score].label;
        strengthLabel.style.color = palette[score].color;
    };

    const revealPassword = (shouldFocus) => {
        state.passwordVisible = true;
        passwordWrap.classList.add('is-visible');
        if (shouldFocus) {
            window.setTimeout(() => {
                passwordInput.focus();
            }, 160);
        }
    };

    const hidePassword = () => {
        if ((emailInput.value || '').trim()) {
            return;
        }
        state.passwordVisible = false;
        passwordWrap.classList.remove('is-visible');
    };

    const canContinueStepOne = () => (fullNameInput.value || '').trim().length > 1;
    const canContinueStepTwo = () => (emailInput.value || '').trim().length > 0 && (passwordInput.value || '').length > 0;
    const canSubmitStepThree = () => {
        const confirm = confirmPasswordInput.value || '';
        return confirm.length > 0 && confirm === (passwordInput.value || '');
    };

    const updateCTAState = () => {
        continueButton.disabled = !(state.step === 1 ? canContinueStepOne() : canContinueStepTwo());
        submitButton.disabled = !canSubmitStepThree();
    };

    const focusForStep = (step) => {
        if (step === 1) {
            fullNameInput.focus();
            return;
        }
        if (step === 2) {
            if (state.passwordVisible && (emailInput.value || '').trim()) {
                passwordInput.focus();
            } else {
                emailInput.focus();
            }
            return;
        }
        confirmPasswordInput.focus();
    };

    const transitionTo = (targetStep) => {
        const nextStep = clampStep(targetStep);
        if (nextStep === state.step) {
            return;
        }

        clearInlineError();

        const direction = nextStep > state.step ? 'forward' : 'backward';
        const currentEl = steps[state.step - 1];
        const nextEl = steps[nextStep - 1];

        currentEl.classList.remove('is-active');
        currentEl.classList.add(direction === 'forward' ? 'is-exiting-left' : 'is-exiting-right');

        nextEl.classList.remove('is-exiting-left', 'is-exiting-right');
        nextEl.classList.add(direction === 'forward' ? 'is-entering-right' : 'is-entering-left');

        requestAnimationFrame(() => {
            nextEl.classList.add('is-active');
            nextEl.classList.remove('is-entering-right', 'is-entering-left');
        });

        window.setTimeout(() => {
            currentEl.classList.remove('is-exiting-left', 'is-exiting-right');
            currentEl.setAttribute('aria-hidden', 'true');
            nextEl.setAttribute('aria-hidden', 'false');
        }, 260);

        state.step = nextStep;
        updateHeading();
        updateProgress();
        updateBackButton();
        updateSecondaryAction();
        updateCTAState();

        window.setTimeout(() => {
            focusForStep(nextStep);
        }, 160);
    };

    const validateStepAndContinue = () => {
        if (state.step === 1) {
            if (!canContinueStepOne()) {
                fullNameField.classList.add('is-error');
                showInlineError('Enter your full name to continue.');
                fullNameInput.focus();
                return;
            }
            fullNameField.classList.remove('is-error');
            clearInlineError();
            transitionTo(2);
            return;
        }

        if (state.step === 2) {
            if (!(emailInput.value || '').trim()) {
                emailField.classList.add('is-error');
                showInlineError('Enter your email or phone to continue.');
                emailInput.focus();
                return;
            }
            if (!isEmailValid()) {
                emailField.classList.add('is-error');
                showInlineError('Enter a valid email to continue.');
                emailInput.focus();
                return;
            }
            if (!(passwordInput.value || '').length) {
                passwordField.classList.add('is-error');
                showInlineError('Enter a password to continue.');
                revealPassword(true);
                return;
            }

            emailField.classList.remove('is-error');
            passwordField.classList.remove('is-error');
            clearInlineError();
            transitionTo(3);
        }
    };

    const validateConfirmPassword = (withShake) => {
        const confirm = confirmPasswordInput.value || '';
        const password = passwordInput.value || '';
        const isMatch = confirm.length > 0 && confirm === password;

        if (isMatch) {
            confirmPasswordField.classList.remove('is-error');
            confirmPasswordField.classList.add('is-valid');
            clearInlineError();
            return true;
        }

        confirmPasswordField.classList.remove('is-valid');
        confirmPasswordField.classList.add('is-error');
        showInlineError("Passwords don't match");

        if (withShake) {
            confirmPasswordField.classList.remove('is-shaking');
            requestAnimationFrame(() => {
                confirmPasswordField.classList.add('is-shaking');
            });
        }

        return false;
    };

    backButton.addEventListener('click', () => {
        transitionTo(state.step - 1);
    });

    continueButton.addEventListener('click', () => {
        validateStepAndContinue();
    });

    togglePasswordButton.dataset.open = 'false';
    togglePasswordButton.addEventListener('click', () => {
        const open = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', open ? 'text' : 'password');
        togglePasswordButton.dataset.open = open ? 'true' : 'false';
        togglePasswordButton.setAttribute('aria-label', open ? 'Hide password' : 'Show password');
    });

    fullNameInput.addEventListener('input', () => {
        fullNameField.classList.remove('is-error');
        clearInlineError();
        updateFieldStates();
        updateHeading();
        updateCTAState();
    });

    emailInput.addEventListener('input', () => {
        emailField.classList.remove('is-error');
        clearInlineError();
        if (!(emailInput.value || '').trim()) {
            hidePassword();
        }
        updateFieldStates();
        updateCTAState();
    });

    emailInput.addEventListener('blur', () => {
        if ((emailInput.value || '').trim()) {
            revealPassword(true);
        }
    });

    passwordInput.addEventListener('input', () => {
        passwordField.classList.remove('is-error');
        clearInlineError();
        updateFieldStates();
        updateStrength();
        updateCTAState();
    });

    confirmPasswordInput.addEventListener('input', () => {
        confirmPasswordField.classList.remove('is-error');
        clearInlineError();
        updateFieldStates();
        updateCTAState();
    });

    confirmPasswordInput.addEventListener('blur', () => {
        if (state.step === 3 && confirmPasswordInput.value) {
            validateConfirmPassword(true);
        }
    });

    form.addEventListener('submit', (event) => {
        if (state.step < 3) {
            event.preventDefault();
            event.stopImmediatePropagation();
            validateStepAndContinue();
            return;
        }

        if (!validateConfirmPassword(true)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            confirmPasswordInput.focus();
            updateCTAState();
            return;
        }

        clearInlineError();
    }, true);

    window.addEventListener('hashchange', () => {
        if (window.location.hash !== '#signup') {
            return;
        }
        updateHeading();
        updateProgress();
        updateBackButton();
        updateSecondaryAction();
        updateCTAState();
        focusForStep(state.step);
    });

    fullNameField.classList.remove('is-error');
    emailField.classList.remove('is-error');
    passwordField.classList.remove('is-error');
    confirmPasswordField.classList.remove('is-error');

    const focusWhenVisible = () => {
        const parentSection = form.closest('section');
        if (parentSection && window.getComputedStyle(parentSection).display === 'none') {
            window.setTimeout(focusWhenVisible, 80);
            return;
        }
        focusForStep(state.step);
    };

    updateFieldStates();
    updateStrength();
    updateHeading();
    updateProgress();
    updateBackButton();
    updateSecondaryAction();
    updateCTAState();
    focusWhenVisible();
})();
</script>
